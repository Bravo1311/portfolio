name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Check the content
        run: npm run check

      - name: Build the site
        run: npm run build

      - name: Report the size
        run: |
          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "index.html: $(du -h dist/index.html | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14